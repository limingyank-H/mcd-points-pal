[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-points-pal"
version = "1.0.0"
description = "积分宝 · 把麦当劳积分券搬进点餐流程的 WorkBuddy Skill"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcdonalds", "mcp", "skill", "points", "workbuddy"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcd-points-pal = "mcd_points_pal.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
