<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>麦当劳 · 点餐（小程序复刻 + 积分兑换）</title>
<style>
:root{
  --ink:#191813; --ink2:#57544C; --gray:#9B968B; --line:#EEECE7;
  --yel:#FFC120; --red:#CE2220; --card:#FBF5EA;
  --g1:#FFD75E; --g2:#F2A81E; --g3:#B06E00;
  --ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#E8E6E1;font-family:var(--ff);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.phone{width:430px;height:100vh;max-height:1000px;background:#fff;position:relative;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.14)}
@media(max-width:520px){body{background:#fff}.phone{width:100%;max-height:none;box-shadow:none}}

/* ---------- 顶部：搜索 + 胶囊 ---------- */
.topbar{flex:0 0 auto;background:#fff;padding:10px 14px 6px;display:flex;align-items:center;gap:11px}
.homelog{flex:0 0 auto;width:38px;height:38px;border:1.8px solid var(--ink);border-radius:11px;
  display:flex;align-items:center;justify-content:center;background:#fff}
.search{flex:1;min-width:0;height:38px;background:#F4F3F0;border-radius:999px;
  display:flex;align-items:center;gap:7px;padding:0 14px;font-size:14px;color:#B9B5AD;font-weight:500}
.capsule{flex:0 0 auto;height:36px;background:#fff;border:1px solid #ECEAE5;border-radius:999px;
  display:flex;align-items:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.capsule span{display:flex;align-items:center;justify-content:center;min-width:34px;height:100%;color:var(--ink)}
.capsule i{width:1px;height:16px;background:#ECEAE5}

/* ---------- 门店头 ---------- */
.storebar{flex:0 0 auto;background:#fff;padding:8px 16px 12px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid #F5F4F0}
.storeinfo{flex:1;min-width:0}
.storeinfo .sn{font-size:18.5px;font-weight:800;letter-spacing:-.2px;margin:0;
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.storeinfo .sn svg{flex:0 0 auto}
.storeinfo .sm{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:600}
.storeinfo .sm .bdg{display:flex;align-items:center;gap:4px}
.storeinfo .sm .sep{width:1px;height:10px;background:#E4E1DB}
.storeinfo .sm .dist{color:#8D8A83;font-weight:500}
.rsv{flex:0 0 auto;position:relative;background:#fff;border:1px solid #F0EEE9;border-radius:12px;
  padding:9px 13px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px rgba(25,24,19,.08);font-family:var(--ff);cursor:pointer}
.rsv .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--red);border:1.5px solid #fff}

/* ---------- 主体：左分类 + 右商品 ---------- */
.body{flex:1;min-height:0;display:flex;background:#fff}
.rail{flex:0 0 84px;height:100%;overflow-y:auto;scrollbar-width:none;background:#fff;border-right:1px solid #F6F5F1}
.rail::-webkit-scrollbar{display:none}
.ritem{position:relative;padding:13px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;background:none;border:none;font-family:var(--ff);width:100%}
.ritem img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(25,24,19,.12))}
.ritem .rn{font-size:11px;font-weight:600;color:var(--ink2);line-height:1.3;text-align:center;white-space:pre-line}
.ritem .new{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px 6px 6px 1px}
.ritem.on{background:var(--card);border-radius:16px}
.ritem.on .rn{color:var(--red);font-weight:800}
.ritem .ptico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 7px rgba(242,168,30,.45))}
.ritem.on .ptico{filter:drop-shadow(0 5px 9px rgba(242,168,30,.6))}

.list{flex:1;min-width:0;overflow-y:auto;scrollbar-width:none;padding:0 12px 96px}
.list::-webkit-scrollbar{display:none}
.sec{font-size:15px;font-weight:700;color:#6F6C64;margin:14px 2px 10px}
.pcard{position:relative;background:var(--card);border-radius:18px;padding:12px;display:flex;gap:11px;
  margin-bottom:11px}
.pimg{flex:0 0 108px;align-self:center}
.pimg img{width:108px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(25,24,19,.16))}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.pname{font-size:15px;font-weight:700;line-height:1.35;margin:0 26px 6px 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:auto}
.tag{font-size:10.5px;font-weight:500;color:#8D8A83;border:1px solid #E3DFD6;
  border-radius:999px;padding:1.5px 8px;white-space:nowrap}
.tag.mk{background:var(--yel);border-color:var(--yel);color:var(--ink);font-weight:700}
.tag.save{background:#FFEDE4;border-color:#FFE0D2;color:var(--red);font-weight:800}
.prow{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.price{display:flex;align-items:baseline;color:var(--red);font-weight:800}
.price .r{font-size:12px;margin-right:1px}
.price .v{font-size:21px;letter-spacing:-.5px}
.orig{font-size:11.5px;color:#B9B5AD;font-weight:500;text-decoration:line-through}
.buy{margin-left:auto;flex:0 0 auto}
.addbtn{width:30px;height:30px;border-radius:50%;border:none;background:var(--yel);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(255,193,32,.45)}
.addbtn svg{display:block}
.addbtn.done{background:#EDEAE3;box-shadow:none;cursor:default}
.spec{border:none;background:var(--yel);border-radius:999px;padding:6px 12px;font-size:12.5px;
  font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--ff)}
.mkmark{position:absolute;top:10px;right:10px;width:16px;height:16px;opacity:.9}

/* ---------- 积分券卡 ---------- */
.pcard.pt{background:linear-gradient(135deg,#FFFAEC 0%,#FDF3DA 100%)}
.pimg.pti{flex:0 0 92px;align-self:center}
.pimg.pti img{width:92px;height:92px;object-fit:cover;border-radius:16px;
  box-shadow:0 6px 14px rgba(180,120,10,.18)}
.pprice{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:nowrap}
.ptag{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#5A3B00;
  border-radius:999px;padding:2.5px 9px;font-size:11.5px;font-weight:800;letter-spacing:-.2px}
.ptag svg{display:block}
.pplus{color:#B9B5AD;font-size:13px;font-weight:700}
.pcash{color:var(--red);font-size:20px;font-weight:800;letter-spacing:-.5px}
.ptnote{font-size:10.5px;color:#A98A3C;font-weight:600;margin-top:6px}

/* 列表顶部积分横幅 */
.ptbanner{display:flex;align-items:center;gap:11px;background:linear-gradient(100deg,#FFF4D6 0%,#FFE9AE 100%);
  border-radius:16px;padding:12px 14px;margin:4px 0 12px;cursor:pointer}
.ptbanner .bi{flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.ptbanner .bt{flex:1;min-width:0}
.ptbanner .bt b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
.ptbanner .bt span{display:block;font-size:11.5px;color:#8A6B1F;font-weight:600;margin-top:3px}
.ptbanner .ba{flex:0 0 auto;font-size:12px;font-weight:800;color:#8A6B1F}

/* ---------- 底部购物条 ---------- */
.cartbar{position:absolute;left:12px;right:12px;bottom:14px;height:58px;background:#3B3833;
  border-radius:999px;display:flex;align-items:center;padding:5px 6px 5px 16px;gap:11px;
  box-shadow:0 10px 30px rgba(25,24,19,.35);cursor:pointer;z-index:20}
.bag{position:relative;flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:#4A463F;
  display:flex;align-items:center;justify-content:center}
.bag .cnt{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;border-radius:999px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:none;
  align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #3B3833}
.bag .cnt.on{display:flex}
.ctext{flex:1;min-width:0}
.ctext .t1{font-size:13.5px;font-weight:700;color:#A7A29A;margin:0}
.ctext .t1.on{color:#fff}
.ctext .t2{font-size:10.5px;color:#7C776F;margin:2px 0 0;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctext .t2 b{color:#FFD75E}
.gopay{flex:0 0 auto;border:none;border-radius:999px;height:46px;padding:0 22px;
  font-size:15px;font-weight:700;font-family:var(--ff);background:#57524B;color:#8F8A82;cursor:not-allowed}
.gopay.on{background:var(--yel);color:var(--ink);cursor:pointer}

/* ---------- 购物车面板 / 规格面板 ---------- */
.mask{position:absolute;inset:0;background:rgba(25,24,19,.45);z-index:30;display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;
  z-index:31;transform:translateY(105%);transition:transform .22s;max-height:78%;
  display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .sh-h{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 8px}
.sheet .sh-h b{font-size:16px;font-weight:800}
.sheet .sh-h button{border:none;background:#F4F3F0;border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:var(--ff)}
.sheet .sh-b{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px}
.crow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F6F5F1}
.crow img{width:48px;height:48px;object-fit:contain}
.crow img.sq{object-fit:cover;border-radius:12px;box-shadow:0 3px 8px rgba(180,120,10,.16)}
.crow .cn{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.crow .cp{font-size:12.5px;color:var(--red);font-weight:800;margin-top:3px}
.crow .cp .pt{color:#B06E00}
.crow .step{display:flex;align-items:center;gap:9px}
.crow .step button{width:24px;height:24px;border-radius:50%;border:none;background:var(--yel);
  font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.crow .step button.minus{background:#F0EEE9}
.crow .step .q{font-size:13.5px;font-weight:800;min-width:14px;text-align:center}
.sheet .sh-f{flex:0 0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid #F3F1EC;display:flex;align-items:center;gap:12px}
.sheet .sh-f .sum{flex:1;font-size:13px;color:var(--ink2);font-weight:600}
.sheet .sh-f .sum b{font-size:19px;color:var(--ink);font-weight:800;margin-left:4px}
.sheet .sh-f .sum em{display:block;font-style:normal;font-size:11px;color:#B06E00;font-weight:700;margin-top:2px}
.sheet .sh-f .cta{border:none;background:var(--yel);border-radius:999px;height:46px;padding:0 26px;
  font-size:15px;font-weight:800;font-family:var(--ff);cursor:pointer}
.emptycart{padding:34px 0 40px;text-align:center;color:#B9B5AD;font-size:13px;font-weight:500}

/* 购物车内「还能用积分换」推荐 */
.rec{margin-top:16px}
.rec .rh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#8A6B1F;margin-bottom:9px}
.rec .rh i{flex:1;height:1px;background:#F0E4C4}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.rrow img{width:42px;height:42px;object-fit:cover;border-radius:11px}
.rrow .rn2{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35}
.rrow .rn2 span{display:block;font-size:11px;color:#B06E00;font-weight:800;margin-top:3px}
.rrow button{flex:0 0 auto;border:none;background:var(--yel);border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:800;cursor:pointer;font-family:var(--ff)}
.rrow button.dis{background:#F0EEE9;color:#B9B5AD;cursor:not-allowed}

/* 结算面板明细 */
.billbox{background:#FAF9F6;border-radius:16px;padding:13px 14px;margin-top:14px}
.brow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600;padding:4px 0}
.brow b{color:var(--ink);font-weight:800}
.brow.red b{color:var(--red)}
.brow.gold{color:#B06E00}
.brow.gold b{color:#B06E00}
.brow.total{margin-top:7px;padding-top:9px;border-top:1px dashed #E6E2D8;font-size:14px}
.brow.total b{font-size:19px;color:var(--red)}
.payhead{display:flex;align-items:center;gap:8px;background:#FFF8E6;border-radius:12px;
  padding:10px 12px;font-size:12.5px;font-weight:700;color:#8A6B1F;line-height:1.5}

/* 规格面板 */
.specsheet .sp-b{padding:4px 18px 16px}
.specrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F6F5F1}
.specrow .k{font-size:13px;font-weight:700}
.specrow .opts{display:flex;gap:8px}
.opt{border:1.5px solid #E3DFD6;background:#fff;border-radius:999px;padding:6px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--ff);color:var(--ink2)}
.opt.on{border-color:var(--ink);color:var(--ink);font-weight:800;background:var(--card)}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(25,24,19,.88);
  color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:9px 18px;z-index:80;
  opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* ---------- 下单成功 · 暴金币 ---------- */
.success{position:absolute;inset:0;background:#fff;z-index:70;display:none;flex-direction:column}
.success.on{display:flex}
.hero{position:relative;flex:0 0 auto;min-height:326px;overflow:hidden;
  background:linear-gradient(168deg,#FFFBF0 0%,#FFF0C4 42%,#FFD75E 100%);
  padding:30px 22px 22px;text-align:center}
.coin{position:absolute;top:-46px;display:block;opacity:0;animation-name:fall;
  animation-timing-function:linear;animation-iteration-count:infinite;pointer-events:none}
@keyframes fall{
  0%{transform:translateY(-46px) rotate(0deg) scale(.55);opacity:0}
  9%{opacity:1}
  78%{opacity:1}
  100%{transform:translateY(392px) rotate(540deg) scale(1);opacity:0}
}
.glow{position:absolute;left:50%;top:74px;width:230px;height:230px;margin-left:-115px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(255,238,180,.5) 45%,rgba(255,215,94,0) 72%);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.hwrap{position:relative;z-index:2}
.hbig{width:66px;height:66px;margin:2px auto 12px;display:block;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.hero .k{font-size:13.5px;font-weight:800;color:#96741C;letter-spacing:.4px;margin:0}
.hero .num{font-size:66px;font-weight:800;letter-spacing:-3px;line-height:1;margin:8px 0 0;color:#6E5210}
.hero .num small{font-size:20px;font-weight:800;letter-spacing:0;margin-left:4px;color:#96741C;vertical-align:6px}
.hero .sub2{font-size:12.5px;font-weight:700;color:#96741C;margin:9px 0 0}
.scontent{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}

.balcard{background:#fff;border:1px solid #F2EEE3;border-radius:20px;padding:15px 16px;
  box-shadow:0 6px 20px rgba(25,24,19,.05)}
.balcard .bh{display:flex;align-items:baseline;justify-content:space-between}
.balcard .bh span{font-size:12.5px;font-weight:600;color:var(--gray)}
.balcard .bh b{font-size:22px;font-weight:800;color:#B06E00;letter-spacing:-.6px}
.bar{height:9px;border-radius:999px;background:#F3EFE4;margin:11px 0 9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--g1),var(--g2));transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.balcard .goal{font-size:12px;font-weight:700;color:var(--ink2);line-height:1.55}
.balcard .goal b{color:var(--red)}
.balcard .goal i{font-style:normal;color:var(--gray);font-weight:600}

.detail{margin-top:16px;background:#FAF9F6;border-radius:18px;padding:14px 15px}
.detail h4{font-size:12.5px;font-weight:800;color:var(--gray);margin:0 0 9px;letter-spacing:.3px}
.drow{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;
  color:var(--ink2);padding:4.5px 0;gap:10px}
.drow em{font-style:normal;color:#B06E00;font-weight:800;font-size:11.5px;
  background:#FFF4D6;border-radius:6px;padding:1px 6px;flex:0 0 auto}
.drow b{font-weight:800;color:var(--ink);flex:0 0 auto}
.drow.tot{margin-top:8px;padding-top:9px;border-top:1px dashed #E6E2D8;font-size:14px}
.drow.tot b{font-size:18px;color:var(--red)}
.codebar{display:flex;align-items:center;justify-content:space-between;background:#FFF8E6;
  border-radius:14px;padding:11px 14px;margin-top:12px}
.codebar span{font-size:12px;font-weight:600;color:#8A6B1F}
.codebar b{font-size:20px;font-weight:800;letter-spacing:2px;color:#8A6B1F}
.sdone{margin-top:16px;width:100%;border:none;background:var(--yel);border-radius:999px;height:50px;
  font-size:16px;font-weight:800;font-family:var(--ff);cursor:pointer}
</style>
</head>
<body>
<div class="phone">

  <!-- 顶部 -->
  <div class="topbar">
    <div class="homelog">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#191813" d="M17.243 3.006c2.066 0 3.742 8.714 3.742 19.478H24c0-11.588-3.042-20.968-6.766-20.968-2.127 0-4.007 2.81-5.248 7.227-1.241-4.416-3.121-7.227-5.231-7.227C3.031 1.516 0 10.888 0 22.476h3.014c0-10.763 1.658-19.47 3.724-19.47 2.066 0 3.741 8.05 3.741 17.98h2.997c0-9.93 1.684-17.98 3.75-17.98Z"/></svg>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B9B5AD" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      薯条
    </div>
    <div class="capsule">
      <span><svg width="18" height="4" viewBox="0 0 18 4"><circle cx="2" cy="2" r="1.7" fill="#191813"/><circle cx="9" cy="2" r="1.7" fill="#191813"/><circle cx="16" cy="2" r="1.7" fill="#191813"/></svg></span>
      <i></i>
      <span style="font-size:15px;font-weight:700">—</span>
      <i></i>
      <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#191813" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="#191813" stroke="none"/></svg></span>
    </div>
  </div>

  <!-- 门店 -->
  <div class="storebar">
    <div class="storeinfo">
      <p class="sn">麦当劳（深圳 · 示例门店）
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8D8A83" stroke-width="2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      </p>
      <div class="sm">
        <span class="bdg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B98A1B" stroke-width="2.2"><path d="M6 8h12l1.5 12h-15L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          到店取餐
        </span>
        <span class="sep"></span>
        <span class="dist">距离 1.1km</span>
      </div>

/* key: 普通商品 = 商品 code；积分券 = "P" + spuId */
function itemOf(k){
  if (k.charAt(0) === "P"){
    var c = findPoint(+k.slice(1));
    return {name:c.nm, img:c.img, pay:c.pay, pt:c.pt, worth:c.worth, isPt:true, sq:true};

  var m = MEALS[k];
  return {name:m[0], img:m[1], pay:m[2], pt:0, worth:m[3], isPt:false, sq:false};
}

/* ---------- 购物车 ---------- */
function add(code, d){
  cart[code] = Math.max(0, (cart[code] || 0) + d);
  if (!cart[code]) delete cart[code];
  renderBar(); if (cur === "pts") renderPointsList();
}
function addPt(id){
  var c = findPoint(id), k = "P" + id;
  if (cart[k]){ toast("每单限换 1 份"); return }
  if (c.pt > BAL){ toast("积分不够，还差 " + (c.pt - BAL).toFixed(1) + " 分"); return }
  cart[k] = 1;
  renderBar(); renderPointsList();
  toast("已加入 · " + c.pt + " 分 + " + yuan(c.pay));
}
function cartStat(){
  var n = 0, cash = 0, pt = 0, worth = 0;
  Object.keys(cart).forEach(function(k){
    var it = itemOf(k), q = cart[k];
    n += q; cash += it.pay * q; pt += it.pt * q;
    worth += (it.isPt ? it.worth : it.pay) * q;
  });
  return {n:n, cash:cash, pt:pt, worth:worth, save:worth - cash};
}
function renderBar(){
  var s = cartStat();
  $("cnt").textContent = s.n;
  $("cnt").classList.toggle("on", s.n > 0);
  $("ct1").textContent = s.n > 0 ? ("已选 " + s.n + " 件商品") : "未选购商品";
  $("ct1").classList.toggle("on", s.n > 0);
  if (s.n === 0){
    $("ct2").innerHTML = POINTS.length + " 张积分券可用 · 点此查看";
  } else if (s.pt > 0){
    $("ct2").innerHTML = '已用 <b>' + s.pt + ' 积分</b> · 省 ' + yuan(s.save) + ' · 点此查看';
  } else {
    $("ct2").textContent = "合计 " + yuan(s.cash) + " · 还能用积分换餐";
  }
  $("gopay").classList.toggle("on", s.n > 0);
  $("gopay").textContent = s.n > 0 ? ("去结算 " + yuan(s.cash)) : "去结算";
}
function renderCartRows(){
  var h = "", s = cartStat();
  Object.keys(cart).forEach(function(k){
    var it = itemOf(k), q = cart[k];
    h += '<div class="crow"><img class="'+(it.sq?"sq":"")+'" src="'+it.img+'" alt="">'
      + '<div class="cn">'+it.name+(it.isPt ? '<div class="cp"><span class="pt">'+it.pt+' 分</span> + '+yuan(it.pay)+'</div>' : '<div class="cp">'+yuan(it.pay)+'</div>')+'</div>'
      + '<div class="step"><button class="minus" data-k="'+k+'">−</button>'
      + '<span class="q">'+q+'</span><button data-k="'+k+'">+</button></div></div>';
  });
  /* 「这单还能用积分换」推荐：换得起、未加入、按每积分效率排前 3 */
  var recs = POINTS_SORTED.filter(function(c){ return c.pt <= BAL && !cart["P"+c.id] }).slice(0,3);
  if (s.n > 0 && recs.length){
    h += '<div class="rec"><div class="rh">'+COIN_SMALL+' 这单还能用积分换<i></i></div>';
    recs.forEach(function(c){
      h += '<div class="rrow"><img src="'+c.img+'" alt="">'
        + '<div class="rn2">'+c.nm+'<span>'+c.pt+' 分 + '+yuan(c.pay)+' · 省 '+yuan(c.worth-c.pay)+'</span></div>'
        + '<button data-rec="'+c.id+'">换一份</button></div>';
    });
    h += '</div>';
  }
  $("crows").innerHTML = h || '<div class="emptycart">购物车还是空的</div>';
  $("csum").textContent = yuan(s.cash);
  $("cpt").textContent = s.pt > 0 ? ("已用 " + s.pt + " 积分 · 省 " + yuan(s.save)) : "";
  Array.prototype.forEach.call($("crows").querySelectorAll("[data-k]"), function(b){
    b.onclick = function(){
      var k = b.dataset.k, d = b.classList.contains("minus") ? -1 : 1;
      if (d > 0 && k.charAt(0) === "P" && cart[k] >= 1){ toast("每单限换 1 份"); return }
      cart[k] = Math.max(0, (cart[k] || 0) + d);
      if (!cart[k]) delete cart[k];
      renderBar(); renderCartRows(); if (cur === "pts") renderPointsList();
    };
  });
  Array.prototype.forEach.call($("crows").querySelectorAll("[data-rec]"), function(b){
    b.onclick = function(){ addPt(+b.dataset.rec); renderCartRows() };
  });
}

  $("mask").classList.remove("on");
  $("cartSheet").classList.remove("on");
  $("paySheet").classList.remove("on");
  $("specSheet").classList.remove("on");
}
function openSpec(code){
  var m = MEALS[code];
  $("spName").textContent = m[0];
  $("spBody").innerHTML = specOf(code).map(function(s){
    return '<div class="specrow"><span class="k">'+s[0]+'</span><span class="opts">'
      + '<button class="opt on">'+s[1]+'</button></span></div>';
  }).join("") + '<button class="cta" style="width:100%;border:none;background:#FFC120;border-radius:999px;height:46px;font-size:15px;font-weight:800;margin-top:14px;font-family:var(--ff)" id="spAdd">加入购物车 '+yuan(m[2])+'</button>';
  openSheet($("specSheet"));
  $("spAdd").onclick = function(){ add(code, 1); closeSheets(); toast("已加入购物车") };
}

/* ---------- 确认订单 ---------- */
function renderPay(){
  var s = cartStat(), priceKeys = Object.keys(cart);
  var h = '<div class="payhead">'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B98A1B" stroke-width="2.2"><path d="M6 8h12l1.5 12h-15L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>'
    + '<span>到店取餐 · 麦当劳（深圳 · 示例门店）<br>积分券在本单随餐核销，到店出示即可</span></div>';
  h += '<div style="margin-top:12px">';
  priceKeys.forEach(function(k){
    var it = itemOf(k), q = cart[k];
    h += '<div class="crow"><img class="'+(it.sq?"sq":"")+'" src="'+it.img+'" alt="">'
      + '<div class="cn">'+it.name+' ×'+q
      + (it.isPt ? '<div class="cp"><span class="pt">'+it.pt+' 分</span> + '+yuan(it.pay)+'</div>' : '<div class="cp">'+yuan(it.pay)+'</div>')
      + '</div></div>';
  });
  h += '</div>';
  h += '<div class="billbox">'
    + '<div class="brow"><span>正常点单</span><b>'+yuan(s.worth)+'</b></div>'
    + (s.pt > 0 ? '<div class="brow red"><span>积分券省下（用 '+s.pt+' 分）</span><b>−'+yuan(s.save)+'</b></div>' : '')
    + '<div class="brow gold"><span>本单可得积分</span><b>+'+Math.floor(s.cash*EARN_RATE)+' 分</b></div>'
    + '<div class="brow total"><span>实付</span><b>'+yuan(s.cash)+'</b></div>'
    + '</div>';
  $("prows").innerHTML = h;
  $("paySum").textContent = yuan(s.cash);
  $("payPt").textContent = s.pt > 0 ? ("用 " + s.pt + " 积分 · 省 " + yuan(s.save)) : "";
}

/* ---------- 下单成功 · 暴金币 ---------- */
function rainCoins(){
  var h = "";
  for (var i=0;i<30;i++){
    var left = (i * 3.4 + (i%4)*11) % 100;
    var size = 15 + Math.round((i*7)%16);
    var dur = (1.6 + ((i*13)%11)/10).toFixed(2);
    var delay = ((i*17)%23)/10;
    h += '<span class="coin" style="left:'+left.toFixed(1)+'%;width:'+size+'px;height:'+size+'px;'
      + 'animation-duration:'+dur+'s;animation-delay:'+delay.toFixed(1)+'s">'+coinSVG(size)+'</span>';
  }
  $("coins").innerHTML = h;
}
function roll(el, to, dur, suffix){
  var st = null;
  function tick(t){
    if (st === null) st = t;
    var p = Math.min(1, (t - st) / dur);
    var e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = "+" + Math.round(to * e) + (suffix || "");
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function showSuccess(){
  var s = cartStat();
  var used = s.pt;
  var earn = Math.floor(s.cash * EARN_RATE);
  var before = BAL;
  var after = before - used + earn;

  /* 找到「比现在余额高的最近一档」券，作为下次目标 */
  var next = null;
  POINTS_SORTED.forEach(function(c){
    if (c.pt > after && (!next || c.pt < next.pt)) next = c;
  });
  var gap = next ? (next.pt - after) : 0;
  var times = next ? Math.max(1, Math.ceil(gap / Math.max(earn,1))) : 0;

  $("hbig").innerHTML = coinSVG(66);
  roll($("earnNum"), earn, 1100, "<small>分</small>");
  $("earnSub").textContent = "本单消费 " + yuan(s.cash) + " · " + (used > 0 ? "已用 " + used + " 分换餐" : "未使用积分");
  $("balNow").textContent = after.toFixed(1) + " 分";

  $("balGoal").innerHTML = next
    ? ('再攒 <b>' + gap.toFixed(1) + ' 分</b>，就能换「' + next.nm + '」<i>· 按今天这单的速度，约再来 ' + times + ' 次</i>')
    : '积分很充足，商城里所有券都换得起。';

  var pct = next ? Math.min(100, after / next.pt * 100) : 100;
  $("balBar").style.width = "0%";
  setTimeout(function(){ $("balBar").style.width = pct.toFixed(1) + "%" }, 90);

  /* 明细 */
  var h = '<h4>本单明细</h4>';
  Object.keys(cart).forEach(function(k){
    var it = itemOf(k);
    h += '<div class="drow"><span>'+it.name+' ×'+cart[k]+'</span>'
      + (it.isPt ? '<em>用 '+it.pt+' 分</em>' : '')
      + '<b>'+yuan(it.pay)+'</b></div>';
  });
  h += '<div class="drow tot"><span>实付</span><b>'+yuan(s.cash)+'</b></div>';
  if (used > 0) h += '<div class="drow"><span>积分变动</span><b>−'+used+' 分 → +'+earn+' 分</b></div>';
  if (EXPIRING > 0) h += '<div class="drow"><span>注意：' + EXPIRING + ' 分本月 ' + (new Date().getMonth() + 1) + ' 月 31 日前过期，记得来用</span><b></b></div>';
  $("sdetail").innerHTML = h;

  BAL = after;
  rainCoins();
  $("success").classList.add("on");
}

/* ---------- toast ---------- */
var toastTimer;
function toast(t){
  $("toast").textContent = t;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ $("toast").classList.remove("on") }, 1600);
}

/* ---------- 事件绑定 ---------- */
$("cartbar").onclick = function(){ renderCartRows(); openSheet($("cartSheet")) };
$("mask").onclick = closeSheets;
$("spClose").onclick = closeSheets;
$("payClose").onclick = closeSheets;
$("clear").onclick = function(){ cart = {}; renderBar(); renderCartRows(); if (cur === "pts") renderPointsList() };
$("gopay").onclick = function(e){
  e.stopPropagation();
  if (!Object.keys(cart).length) return;
  renderPay(); openSheet($("paySheet"));
};
$("checkout").onclick = function(){
  if (!Object.keys(cart).length) return;
  renderPay(); openSheet($("paySheet"));
};
$("submitOrder").onclick = function(){
  closeSheets();
  if (cur === "pts") { cur = "c0"; renderRail(); }
  showSuccess();
  cart = {};
  renderBar(); renderList();
};
$("sDone").onclick = function(){ $("success").classList.remove("on") };

renderRail(); renderList(); renderBar();
</script>
</body>
