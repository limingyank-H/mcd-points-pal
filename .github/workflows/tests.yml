name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: Test
        run: pytest tests/ -q
      - name: Offline demo must run end to end
        run: |
          python -m mcd_points_pal list
          python -m mcd_points_pal advise --cart 9900005456:1,P17078:1
          python -m mcd_points_pal checkout --cart 9900005456:1,P17078:1
